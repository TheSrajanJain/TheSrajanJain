<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Srajan Jain - Developer, Problem Solver, AI and App Builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#36BCF7"/>
      <stop offset="100%" stop-color="#7ee8c1"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .name{font:800 62px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:1px}
    .sub{font:600 21px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#cfe9f5;letter-spacing:.5px}
    .tag{font:500 15px 'Courier New',Consolas,monospace;fill:#36BCF7;letter-spacing:1px}
    .fade{opacity:0;animation:fade 1.1s ease-out forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.5s}.d3{animation-delay:.9s}
    .float1{animation:f1 7s ease-in-out infinite}
    .float2{animation:f2 9s ease-in-out infinite}
    .bar{transform-origin:500px 0;animation:grow 1.2s .6s ease-out both}
    @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-14px)}}
    @keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-22px,12px)}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
  <g clip-path="url(#round)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <g opacity=".18">
      <circle class="float1" cx="120" cy="60" r="90" fill="#36BCF7"/>
      <circle class="float2" cx="880" cy="210" r="120" fill="#7ee8c1"/>
      <circle class="float1" cx="760" cy="40" r="45" fill="#ffffff"/>
    </g>
    <g stroke="#ffffff" stroke-opacity=".05">
      <path d="M0 65H1000M0 130H1000M0 195H1000"/>
      <path d="M250 0V260M500 0V260M750 0V260"/>
    </g>
    <text class="name fade d1" x="500" y="115" text-anchor="middle">Srajan Jain</text>
    <rect class="bar" x="410" y="132" width="180" height="4" rx="2" fill="url(#accent)"/>
    <text class="sub fade d2" x="500" y="175" text-anchor="middle">Developer  •  Problem Solver  •  AI &amp; App Builder</text>
    <text class="tag fade d3" x="500" y="215" text-anchor="middle">&lt;/&gt; build • test • debug • repeat</text>
  </g>
</svg>
